<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mochis, animated avatars</title>
    <meta
      name="description"
      content="Mochis is a tiny animated avatar engine: one soft shape, seven moods, reactions to touch, light and dark modes, mix-and-match accessories, in real 3D (Soft, Flat, Pixel). Try it in your browser."
    />

    <link rel="canonical" href="https://mochiz.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mochiz.vercel.app/" />
    <meta property="og:title" content="Mochis, animated avatars" />
    <meta
      property="og:description"
      content="One soft shape, seven moods, and it reacts when you touch it. Real 3D in three styles, light and dark, with accessories you can mix."
    />
    <meta property="og:site_name" content="Mochis" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://mochiz.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mochis: three 3D Mochi characters on a light background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mochiz.vercel.app/og.png" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preload" href="/src/site/fonts/fredoka-600-letters.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#fbfbf9" />
  </head>
  <body>
    <script>
      // set the theme before the first paint: no light flash in dark mode
      try {
        var c = localStorage.getItem('mochi-site-theme')
        var d = c === 'dark' || (c !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
      } catch (e) {}
      // the first Mochis of the hero (the largest image of the first screen): fetched now, in the page's theme, while
      // the scripts load, instead of once they have drawn the page (HERO_FIRST in src/site/Hero.ts)
      ;['scroll-01', 'scroll-02', 'scroll-03', 'scroll-04'].forEach(function (n) {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/renders/' + n + '-' + (document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light') + '.webp'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      })
    </script>
    <div id="site"></div>
    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
