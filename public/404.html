<!doctype html>
<!--
  Page shown by Vercel for an address that does not exist (any file named 404.html in the output).
  Plain HTML and CSS, no script: it must show even when everything else fails. Same colors as the site.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found, Mochiz</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101011" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        --bg: #fbfbf9;
        --ink: #111113;
        --muted: #6b6b72;
        --line: rgba(17, 17, 19, 0.14);
        --btn-bg: #111113;
        --btn-ink: #fbfbf9;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101011;
          --ink: #f5f5f2;
          --muted: #a1a1a8;
          --line: rgba(255, 255, 255, 0.14);
          --btn-bg: #f5f5f2;
          --btn-ink: #101011;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 440px;
      }
      img {
        width: 180px;
        height: 180px;
        display: block;
        margin: 0 auto 8px;
      }
      .code {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      h1 {
        margin: 6px 0 10px;
        font-family: ui-sans-serif, 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.5;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 11px 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
      a.primary {
        background: var(--btn-bg);
        border-color: var(--btn-bg);
        color: var(--btn-ink);
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="/renders/shape-cloud-3d-dark.webp" media="(prefers-color-scheme: dark)" />
        <img src="/renders/shape-cloud-3d-light.webp" alt="A Mochi" width="180" height="180" />
      </picture>
      <p class="code">404</p>
      <h1>This page does not exist</h1>
      <p>The Mochi looked everywhere. The page may have moved, or the address has a typo.</p>
      <nav>
        <a class="primary" href="/">Home</a>
        <a href="/docs">Docs</a>
      </nav>
    </main>
  </body>
</html>
