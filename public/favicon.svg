<!--
  Le mochi au repos : un cercle violet et les deux matrices d'yeux produites par
  `engine.sample(1)` sur l'etat `idle`. Les yeux sont des trous (le fond de l'onglet passe
  au travers), plus un reflet doux en haut a gauche.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -108 216 216">
  <defs>
    <radialGradient id="degrade" cx="-0.35" cy="-0.4" r="1.15">
      <stop offset="0" stop-color="#b79cff" />
      <stop offset="0.55" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#6d3fd6" />
    </radialGradient>
    <mask id="yeux">
      <circle r="100" fill="#fff" />
      <path
        d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z"
        transform="matrix(0.87,-0.33,0.45,0.84,21.42,-43.32)"
      />
      <path
        d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z"
        transform="matrix(0.64,-0.06,0.45,0.84,62.98,-53.9)"
      />
    </mask>
  </defs>

  <circle r="100" fill="url(#degrade)" mask="url(#yeux)" />
</svg>
