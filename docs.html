<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mochis docs, add an animated avatar to your app</title>
    <meta
      name="description"
      content="How to add Mochis to any web page or app: installation from the repository, your first avatar in a few lines, shapes, colors, styles, moods, accessories, theme and every option, with copyable examples."
    />

    <link rel="canonical" href="https://mochiz.vercel.app/docs" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mochiz.vercel.app/docs" />
    <meta property="og:title" content="Mochis docs" />
    <meta
      property="og:description"
      content="One soft shape, seven moods, and it reacts when you touch it. Real 3D in three styles, light and dark, with accessories you can mix."
    />
    <meta property="og:site_name" content="Mochis" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://mochiz.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mochis: three 3D Mochi characters on a light background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mochiz.vercel.app/og.png" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preload" href="/src/site/fonts/fredoka-600-letters.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#fbfbf9" />
  </head>
  <body>
    <script>
      // set the theme before the first paint: no light flash in dark mode
      try {
        var c = localStorage.getItem('mochi-site-theme')
        var d = c === 'dark' || (c !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <div id="site"></div>
    <script type="module" src="/src/docs/main.ts"></script>
  </body>
</html>
