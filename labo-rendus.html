<!doctype html>
<!--
  Prototype : le meme Mochi 3D rendu en plat, en pixel art et en pate, a cote du rendu 2D actuel,
  avec des mesures de performance et un test d'export en planche d'images. Page d'outil,
  non liee depuis le site (noindex).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Mochi, render modes prototype</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #fbfaf7; color: #232634; }
      h1 { font-size: 1.1rem; margin: 0 0 4px; }
      p { color: #6b6f7e; max-width: 70ch; margin: 4px 0 14px; }
      table { border-collapse: collapse; }
      th { font-size: 12px; color: #6b6f7e; font-weight: 600; padding: 4px 6px; text-align: center; }
      td { padding: 4px 6px; text-align: center; }
      th.sep, td.sep { border-left: 2px solid #e9e6df; }
      canvas.px { image-rendering: pixelated; width: 150px; height: 150px; }
      pre { background: #20232f; color: #e9e8f4; padding: 12px; border-radius: 10px; max-width: 90ch; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Render modes from one 3D Mochi</h1>
    <p>Left: today's 2D renderers. Right: the same model in real 3D, shown flat, as pixel art (rendered at low resolution then quantised to a small palette) and as soft clay. Same frame, same accessory (beanie).</p>
    <div id="r"></div>
    <pre id="res">measuring...</pre>
    <script type="module" src="/src/labo/rendus.ts"></script>
  </body>
</html>
