<!doctype html>
<!--
  Source de public/og.png (image de partage 1200x630). Page de dev, hors build : servie par
  `pnpm dev` a /tools/og.html, puis capturee a 1200x630 par Chrome headless.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochi og</title>
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbfaf7; }
      body { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif; color: #232634; position: relative; }
      .glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
      h1 { position: absolute; left: 88px; top: 190px; margin: 0; font-size: 196px; line-height: 1; letter-spacing: -0.04em; }
      p { position: absolute; left: 94px; margin: 0; color: #6b6f7e; }
      .l1 { top: 400px; font-size: 40px; color: #232634; font-weight: 600; letter-spacing: -0.01em; }
      .l2 { top: 462px; font-size: 30px; }
      .pill { position: absolute; left: 94px; top: 124px; background: #eeebfa; color: #5a4cc0; font-weight: 700; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 18px; border-radius: 999px; }
      #og { position: absolute; inset: 0; }
      #og svg { position: absolute; }
    </style>
  </head>
  <body>
    <div class="glow" style="left: 640px; top: 90px; width: 420px; height: 420px; background: #dcd4fb"></div>
    <div class="glow" style="left: 930px; top: 300px; width: 300px; height: 300px; background: #fbd3e6"></div>
    <span class="pill">Animated avatars</span>
    <h1>Mochi</h1>
    <p class="l1">One soft shape, five face moods.</p>
    <p class="l2">Flat, pixel art, clay and real 3D.</p>
    <div id="og"></div>
    <script type="module" src="./og.ts"></script>
  </body>
</html>
