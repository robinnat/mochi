<!doctype html>
<!--

  `pnpm dev` a /tools/og.html, puis capturee a 1200x630 par Chrome headless.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mochi og</title>
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbfbf9; }
      body { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif; color: #111113; position: relative; }
            h1 { position: absolute; left: 88px; top: 190px; margin: 0; font-size: 196px; line-height: 1; letter-spacing: -0.04em; }
      p { position: absolute; left: 94px; margin: 0; color: #6b6b72; }
      .l1 { top: 400px; font-size: 40px; color: #111113; font-weight: 600; letter-spacing: -0.01em; }
      .l2 { top: 462px; font-size: 30px; }

      #og { position: absolute; inset: 0; }

  <body>
