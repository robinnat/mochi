name: ci
# `push` limited to main, otherwise each PR branch triggers the same job TWICE (once for the push, once for the PR)
# on exactly the same commit.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
