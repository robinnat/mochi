<!doctype html>
<!--
  `lang` is rewritten at startup by src/i18n: the value here is the one of the first render, before the visitor's
  language is known. The meta tags stay in English whatever happens: social bots (X, Slack, Discord) do not run
  JavaScript, so the shared preview is always the one of the served HTML.
-->
<html lang="en">
  <head>
    <!-- must fit in the first 1024 bytes, so it comes first -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochis, animated avatars</title>
    <meta
      name="description"
      content="Mochis: animated avatars in real 3D, in three styles (Soft, Flat, Pixel), with moods, accessories and exports. No animation library."
    />
    <!--
      No <meta name="robots" content="index, follow">: it is the default value, and Google documents it as having no
      effect. That tag only serves to FORBID something.
    -->
    <!-- Open Graph: `property` attribute, while X tags use `name` -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mochis, animated avatars" />
    <meta
      property="og:description"
      content="Animated avatars in 3D: shapes, expressions, moods, accessories, PNG, GIF and MP4 exports."
    />
    <meta property="og:site_name" content="Mochis" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <!-- `twitter:card` is enough: X reuses og:title and og:description. -->
    <meta name="twitter:card" content="summary" />

    <!--
      The `.ico` first and the SVG after: at equal relevance browsers keep the LAST one, and we want the vector one
      when it is understood. The `.ico` is still needed: older Safari and iOS do not read SVG icons. It holds 16, 32 and
      48 px.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS flattens transparency to black: this one is opaque -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
